[project]
name = "claude-bedrock-gateway"
version = "0.1.0"
description = "Anthropic-compatible AI gateway routing chat to Claude models on Amazon Bedrock"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["httpx>=0.27"]
# Phase 4 benchmark harness (graders, fixtures, anchors, report). Kept out of the
# runtime image — the gateway itself needs none of these.
bench = [
    "httpx>=0.27",
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "python-pptx>=0.6.23",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "pytest>=8.0",
]

[tool.uv]
package = false
